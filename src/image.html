<div class="wtopbar">
  <button class="hide" data-i18n-title="image.hide">👁</button>
  <button class="export" data-i18n-title="image.export">📤</button>
  <button class="lock" data-i18n-title="image.lock">🔓</button>
  <button class="delete" data-i18n-title="image.delete">❌</button>
</div>
<div class="wrapper">
  <div class="wform">
    <div class="wprogress"><div></div><span></span></div>
    <div class="colors"></div>
    <label><span data-i18n="image.opacity"></span>:&nbsp;<input class="opacity" type="range" min="0" max="100"/></label>
    <label><span data-i18n="image.brightness"></span>:&nbsp;<input class="brightness" type="number" step="0.1"/></label>
    <label>
      <span data-i18n="image.strategy"></span>:&nbsp;<select class="strategy">
        <option value="RANDOM" selected data-i18n="image.strategy.random">Random</option>
        <option value="DOWN" data-i18n="image.strategy.down">Down</option>
        <option value="UP" data-i18n="image.strategy.up">Up</option>
        <option value="LEFT" data-i18n="image.strategy.left">Left</option>
        <option value="RIGHT" data-i18n="image.strategy.right">Right</option>
        <option value="SPIRAL_FROM_CENTER" data-i18n="image.strategy.spiralOut">Spiral out</option>
        <option value="SPIRAL_TO_CENTER" data-i18n="image.strategy.spiralIn">Spiral in</option>
      </select>
    </label>
    <button class="reset-size"><span data-i18n="image.resetSize"></span> [<span></span> <span data-i18n="image.pixels"></span>]</button>
    <label class="coord-label"><span class="coord-icon">📍</span> <span data-i18n="image.coord"></span>: <span class="coords"></span></label>
    <div class="crop-section">
      <div class="crop-line">
        <button class="crop-left" data-i18n="image.crop.left">←</button>
        <button class="crop-right" data-i18n="image.crop.right">→</button>
        <button class="crop-up" data-i18n="image.crop.top">↑</button>
        <button class="crop-down" data-i18n="image.crop.bottom">↓</button>
        <span class="crop-hint" data-i18n="image.crop">Crop</span>
      </div>
      <div class="crop-line">
        <input class="crop-input" id="cropL" type="number" min="0" value="0" data-i18n-placeholder="image.crop.left"/>
        <input class="crop-input" id="cropR" type="number" min="0" value="0" data-i18n-placeholder="image.crop.right"/>
        <input class="crop-input" id="cropT" type="number" min="0" value="0" data-i18n-placeholder="image.crop.top"/>
        <input class="crop-input" id="cropB" type="number" min="0" value="0" data-i18n-placeholder="image.crop.bottom"/>
        <button class="crop-apply" data-i18n="image.crop.apply">Apply</button>
      </div>
    </div>
    <label>
      <input type="checkbox" class="draw-transparent"/>&nbsp;<span data-i18n="image.drawTransparent"></span>
    </label>
    <label>
      <input type="checkbox" class="draw-colors-in-order"/>&nbsp;<span data-i18n="image.drawColorsInOrder"></span>
    </label>
  </div>
  <div class="resize n"></div>
  <div class="resize e"></div>
  <div class="resize s"></div>
  <div class="resize w"></div>
</div>
