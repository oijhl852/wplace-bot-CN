<div class="wtopbar">
  <button class="hide">👁</button>
  <button class="export">📤</button>
  <button class="lock">🔓</button>
  <button class="delete">❌</button>
</div>
<div class="wrapper">
  <div class="wform">
    <div class="wprogress">
      <div></div>
      <span></span>
    </div>
    <div class="colors"></div>
    <label>不透明度:&nbsp;<input class="opacity" type="range" min="0" max="100"/></label>
    <label>亮度:&nbsp;<input class="brightness" type="number" step="0.1"/></label>
    <label>
      策略:&nbsp;<select class="strategy">
        <option value="RANDOM" selected>随机</option>
        <option value="DOWN">向下</option>
        <option value="UP">向上</option>
        <option value="LEFT">向左</option>
        <option value="RIGHT">向右</option>
        <option value="SPIRAL_FROM_CENTER">向外螺旋</option>
        <option value="SPIRAL_TO_CENTER">向内螺旋</option>
      </select>
    </label>
    <button class="reset-size">重置大小 [<span></span>像素]</button>
    <label>
      <input type="checkbox" class="draw-transparent" />&nbsp;擦除透明像素
    </label>
    <label>
      <input type="checkbox" class="draw-colors-in-order" />&nbsp;按顺序绘制颜色
    </label>
  </div>
  <div class="resize n"></div>
  <div class="resize e"></div>
  <div class="resize s"></div>
  <div class="resize w"></div>
</div>
